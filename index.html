<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My To Do</title>
<meta name="theme-color" content="#7C5CFC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My To Do">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#F3F5FA;--card:#fff;--ink:#1B2033;--mute:#6B7390;--line:#E3E7F1;--track:#E6E9F3;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12152A;--card:#1C2040;--ink:#EEF0FA;--mute:#98A0C4;--line:#2C3158;--track:#2C3158;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12152A;--card:#1C2040;--ink:#EEF0FA;--mute:#98A0C4;--line:#2C3158;--track:#2C3158;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;padding:18px 16px 110px}
h1{font-size:26px;font-weight:800;margin:4px 0 2px}
.sub{color:var(--mute);font-size:14px;margin:0 0 16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:16px;border:1px solid var(--line)}
.bh{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.bh h2{margin:0;font-size:20px;font-weight:800}
.bh p{margin:0;color:var(--mute);font-size:14px}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:800}
.cat{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;margin-bottom:8px;background:var(--bg);border-left:7px solid}
.cat .n{flex:1;min-width:0}
.cat .n strong{display:block;font-weight:700}
.bar{height:8px;border-radius:8px;background:var(--track);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:8px;transition:width .3s}
.cnt{font-size:13px;color:var(--mute);white-space:nowrap}
.add{width:100%;padding:11px;border-radius:14px;border:2px dashed var(--line);color:var(--mute);font-weight:700}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px}
.tabs{display:flex;gap:8px;margin:10px 0 14px}
.tabs button{padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px}
.tabs button.on{color:#fff;border-color:transparent}
.task{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;border-left:7px solid}
.row{display:flex;align-items:flex-start;gap:12px}
.chk{flex:none;width:28px;height:28px;border-radius:9px;border:2.5px solid;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;line-height:1}
.tb{flex:1;min-width:0;text-align:left}
.tt{font-weight:700;overflow-wrap:anywhere}
.tt.done{text-decoration:line-through;color:var(--mute)}
.meta{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:13px;color:var(--mute)}
.meta .bar{flex:1;margin:0}
.pill{font-size:12px;font-weight:800;padding:2px 8px;border-radius:10px;color:#fff}
.subs{margin:10px 0 0 40px}
.st{display:flex;align-items:center;gap:10px;padding:6px 0}
.st .chk{width:22px;height:22px;border-radius:7px;font-size:13px}
.st span.done{text-decoration:line-through;color:var(--mute)}
.st .x{margin-left:auto;color:var(--mute);padding:4px 8px}
.inl{display:flex;gap:8px;margin-top:6px}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex:1;min-width:0}
.go{padding:10px 16px;border-radius:12px;color:#fff;font-weight:800}
.link{color:var(--mute);font-size:13px;margin-top:10px;font-weight:700}
.link.armed{color:#E5484D}
.bar-fix{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.bar-fix .inl{max-width:520px;margin:0 auto}
.sheet{position:fixed;inset:0;background:rgba(10,12,30,.55);display:flex;align-items:flex-end;z-index:20}
.sh{background:var(--card);width:100%;max-width:520px;margin:0 auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sh h3{margin:0 0 12px;font-size:19px;font-weight:800}
.sw{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.sw button.on{border-color:var(--ink)}
.empty{text-align:center;color:var(--mute);padding:28px 10px}
.sync{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:-6px 0 14px;font-size:13px;color:var(--mute)}.sync button:not(.go){font-weight:800;color:var(--mute);padding:6px 10px}.sync .go{width:100%}
.hd{display:flex;justify-content:space-between;align-items:center}.menub{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:22px;font-weight:800}.mi{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}.mi b{display:block}.mi span{font-size:13px;color:var(--mute)}.mi.armed{border-color:#E5484D}.dl{font-size:12px;color:var(--mute);margin-top:2px}.sh{max-height:90vh;overflow:auto}
</style></head>
<body><div id="app"></div><input type="file" id="imp" accept=".json,application/json" hidden>
<script>
var COLORS=['#E5484D','#F76B15','#E5A400','#30A46C','#0E9F8E','#3E63DD','#8E4EC6','#D6409F'];
var BK={personal:{name:'Personal',color:'#7C5CFC'},professional:{name:'Professional',color:'#0E8FA8'}};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var T=function(t,subs,done){return{id:uid(),title:t,done:!!done,added:Date.now(),open:false,subs:(subs||[]).map(function(s){return{id:uid(),t:s[0],done:s[1]}})}};
var seed=function(){return{personal:[
{id:uid(),name:'Amma',color:'#D6409F',tasks:[T('Book eye check-up',[['Call hospital',true],['Pick a date',false]])]},
{id:uid(),name:'Appa',color:'#3E63DD',tasks:[T('Renew health insurance')]},
{id:uid(),name:'Jochu',color:'#F76B15',tasks:[T('School fees',[['Download receipt',true]],true)]}],
professional:[
{id:uid(),name:'Work',color:'#8E4EC6',tasks:[T('Send weekly status report')]},
{id:uid(),name:'Finance',color:'#30A46C',tasks:[T('Internet banking for ICICI bank',[['Register for net banking',true],['Set transaction limit',true],['Add beneficiaries',false],['Link UPI',false]])]}]}};
var S;try{S=JSON.parse(localStorage.getItem('todo-v1'))}catch(e){}
if(!S||!S.personal)S=seed();
S=norm(S);
var ui={view:'home',b:null,c:null,filter:'open',sheet:null,color:COLORS[0],armed:null,focus:null};
function norm(d){['personal','professional'].forEach(function(k){d[k]=d[k]||[];d[k].forEach(function(c){c.tasks=c.tasks||[];c.arch=c.arch||[];c.tasks.concat(c.arch).forEach(function(t){if(!t.added)t.added=Date.now()})})});return d}
function fmt(ms){var d=new Date(ms),y=d.getFullYear()!==new Date().getFullYear();return d.toLocaleDateString('en-IN',y?{day:'numeric',month:'short',year:'numeric'}:{day:'numeric',month:'short'})}
function days(t){return Math.floor((Date.now()-t.added)/864e5)}
function oldN(k){return bts(k).filter(function(t){return!t.done&&days(t)>=30}).length}
function dline(t){if(t.done)return '<div class="dl">Closed '+fmt(t.doneAt||t.added)+'</div>';var d=days(t);return '<div class="dl" style="color:'+(d>=90?'#E5484D':d>=30?'#E5A400':'var(--mute)')+'">Added '+fmt(t.added)+' · '+(d<1?'today':d+' day'+(d>1?'s':''))+'</div>'}
function dl(name,text){try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);return true}catch(e){return false}}
function ymd(){return new Date().toISOString().slice(0,10)}
var LIM=900000;
function pct(){return JSON.stringify(S).length/LIM}
function meter(){var p=pct(),c=p>=.9?'#E5484D':p>=.7?'#E5A400':'#30A46C';return '<div class="card" style="padding:12px"><div class="cnt">Storage used: '+Math.round(JSON.stringify(S).length/1024)+' KB of about '+Math.round(LIM/1024)+' KB ('+Math.max(1,Math.round(p*100))+'%)</div>'+bar(Math.min(p,1),c)+(p>=.7?'<div class="cnt" style="color:'+c+';font-weight:800;margin-top:6px">Getting full. Archive closed tasks or use Start new year.</div>':'')+'</div>'}
function menu(){return '<div class="sheet" data-a="mclose"><div class="sh" data-a="none"><h3>Backup and new year</h3>'+(ui.msg?'<p class="sub" style="color:var(--ink)">'+esc(ui.msg)+'</p>':'')+'<button class="mi" data-a="bk"><b>Save full backup</b><span>Everything, as a file</span></button><button class="mi" data-a="xp"><b>Export pending tasks</b><span>Only open tasks, to carry into a new list</span></button><button class="mi" data-a="ip"><b>Import pending tasks</b><span>Adds them to your current list</span></button><button class="mi'+(ui.armed==='ny'?' armed':'')+'" data-a="ny"><b>Start new year</b><span>Saves a backup, then clears closed and archived tasks</span></button><button class="mi'+(ui.armed==='ir'?' armed':'')+'" data-a="ir"><b>Restore from backup</b><span>Replaces everything with a backup file</span></button></div></div>'}
function archv(c){if(!c.arch.length)return '<div class="empty">Nothing archived yet.</div>';return c.arch.map(function(t){return '<div class="task" style="border-color:'+c.color+'"><div class="tt done">'+esc(t.title)+'</div><div class="dl">Added '+fmt(t.added)+' · closed '+fmt(t.doneAt||t.added)+'</div><div class="inl"><button class="go" style="background:'+c.color+'" data-a="rest" data-id="'+t.id+'">Restore</button><button class="go" style="background:'+(ui.armed==='a'+t.id?'#E5484D':'var(--mute)')+'" data-a="dela" data-id="'+t.id+'">'+(ui.armed==='a'+t.id?'Tap again':'Delete')+'</button></div></div>'}).join('')}
function mergePending(items){items.forEach(function(it){var b=S[it.b];if(!b||!it.task)return;var c=b.filter(function(x){return x.name.toLowerCase()===String(it.cat).toLowerCase()})[0];if(!c){c={id:uid(),name:it.cat,color:it.color||COLORS[0],tasks:[],arch:[]};b.push(c)}if(c.tasks.some(function(x){return x.title===it.task.title&&x.added===it.task.added}))return;var t=JSON.parse(JSON.stringify(it.task));t.id=uid();t.open=false;(t.subs||[]).forEach(function(x){x.id=uid()});c.tasks.push(t)});norm(S);save()}
function save(){try{localStorage.setItem('todo-v1',JSON.stringify(S))}catch(e){}if(window.cloudSave)window.cloudSave()}
function syncRow(){return '<div class="sync">'+(ui.user?'<span>☁ Synced · '+esc(ui.user)+(navigator.onLine?'':' (offline)')+'</span><button data-a="out">Sign out</button>':'<button class="go" style="background:#7C5CFC" data-a="in">Sign in with Google to sync</button>')+(ui.err?'<div class="cnt" style="width:100%">'+esc(ui.err)+'</div>':'')+'</div>'}
function pr(t){return t.done?1:(t.subs.length?t.subs.filter(function(s){return s.done}).length/t.subs.length:0)}
function avg(ts){return ts.length?ts.reduce(function(a,t){return a+pr(t)},0)/ts.length:0}
function bts(b){return S[b].reduce(function(a,c){return a.concat(c.tasks)},[])}
function pc(p){return Math.round(p*100)+'%'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ring(p,col){var r=32,c=2*Math.PI*r;return '<div class="ring"><svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="8"/><circle cx="38" cy="38" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+c*(1-p)+'" transform="rotate(-90 38 38)"/></svg><b>'+pc(p)+'</b></div>'}
function bar(p,col){return '<div class="bar"><i style="width:'+p*100+'%;background:'+col+'"></i></div>'}
function find(){var c=S[ui.b].filter(function(x){return x.id===ui.c})[0];return c}
function home(){
var h='<div class="hd"><h1>My To Do</h1><button class="menub" data-a="menu">⋯</button></div><p class="sub">Tap a category to see its tasks</p>'+syncRow();
Object.keys(BK).forEach(function(k){var b=BK[k],ts=bts(k),op=ts.filter(function(t){return!t.done}).length;
h+='<div class="card"><div class="bh">'+ring(avg(ts),b.color)+'<div><h2>'+b.name+'</h2><p>'+op+' open · '+(ts.length-op)+' closed</p>'+(oldN(k)?'<p style="color:#E5A400;font-weight:800">'+oldN(k)+' pending over 30 days</p>':'<p>Overall work done</p>')+'</div></div>';
S[k].forEach(function(c){var o=c.tasks.filter(function(t){return!t.done}).length;
h+='<button class="cat" style="border-color:'+c.color+'" data-a="cat" data-b="'+k+'" data-id="'+c.id+'"><div class="n"><strong>'+esc(c.name)+'</strong>'+bar(avg(c.tasks),c.color)+'</div><div class="cnt">'+o+' open<br>'+pc(avg(c.tasks))+'</div></button>'});
h+='<button class="add" data-a="newcat" data-b="'+k+'">+ Add category</button></div>'});
h+=meter();return h}
function catv(){
var c=find();if(!c){ui.view='home';return home()}
var col=c.color,p=avg(c.tasks),ts=ui.filter==='arch'?[]:c.tasks.filter(function(t){return ui.filter==='all'||!t.done}),dn=c.tasks.filter(function(t){return t.done}).length;
var h='<div class="top"><button class="back" data-a="home">‹</button><div style="flex:1"><h1 style="margin:0;color:'+col+'">'+esc(c.name)+'</h1><div class="cnt">'+BK[ui.b].name+' · '+pc(p)+' done</div></div></div>'+bar(p,col);
h+='<div class="tabs"><button data-a="f" data-f="open" class="'+(ui.filter==='open'?'on':'')+'" style="'+(ui.filter==='open'?'background:'+col:'')+'">Open</button><button data-a="f" data-f="all" class="'+(ui.filter==='all'?'on':'')+'" style="'+(ui.filter==='all'?'background:'+col:'')+'">All</button><button data-a="f" data-f="arch" class="'+(ui.filter==='arch'?'on':'')+'" style="'+(ui.filter==='arch'?'background:'+col:'')+'">Archive ('+c.arch.length+')</button></div>'+(dn&&ui.filter!=='arch'?'<button class="add" style="margin-bottom:12px" data-a="arch">Archive '+dn+' closed task'+(dn>1?'s':'')+'</button>':'');
if(ui.filter==='arch'){h+=archv(c)}else if(!ts.length)h+='<div class="empty">'+(c.tasks.length?'Everything here is closed. Nice work.':'No tasks yet. Add your first one below.')+'</div>';
ts.forEach(function(t){var n=t.subs.length,d=t.subs.filter(function(s){return s.done}).length,tp=pr(t);
h+='<div class="task" style="border-color:'+col+'"><div class="row"><button class="chk" data-a="tt" data-id="'+t.id+'" style="border-color:'+col+';background:'+(t.done?col:'transparent')+'">'+(t.done?'✓':'')+'</button><button class="tb" data-a="ex" data-id="'+t.id+'"><div class="tt'+(t.done?' done':'')+'">'+esc(t.title)+'</div>'+dline(t)+'<div class="meta">'+(n?bar(tp,col)+'<span>'+d+'/'+n+' steps</span>':'')+'<span class="pill" style="background:'+(t.done?col:'var(--mute)')+'">'+(t.done?'Closed':'Open')+'</span></div></button></div>';
if(t.open){h+='<div class="subs">';t.subs.forEach(function(s){h+='<div class="st"><button class="chk" data-a="ts" data-id="'+t.id+'" data-s="'+s.id+'" style="border-color:'+col+';background:'+(s.done?col:'transparent')+'">'+(s.done?'✓':'')+'</button><span class="'+(s.done?'done':'')+'">'+esc(s.t)+'</span><button class="x" data-a="ds" data-id="'+t.id+'" data-s="'+s.id+'">✕</button></div>'});
h+='<div class="inl"><input id="si-'+t.id+'" placeholder="Add a sub task" data-e="sub" data-id="'+t.id+'"><button class="go" style="background:'+col+'" data-a="as" data-id="'+t.id+'">Add</button></div><button class="link'+(ui.armed==='t'+t.id?' armed':'')+'" data-a="dt" data-id="'+t.id+'">'+(ui.armed==='t'+t.id?'Tap again to delete task':'Delete task')+'</button></div>'}
h+='</div>'});
h+='<button class="link'+(ui.armed==='c'?' armed':'')+'" data-a="dc">'+(ui.armed==='c'?'Tap again to delete category and its tasks':'Delete category')+'</button>';
h+='<div class="bar-fix"><div class="inl"><input id="nt" placeholder="New task in '+esc(c.name)+'" data-e="task"><button class="go" style="background:'+col+'" data-a="at">Add</button></div></div>';
return h}
function sheet(){var b=BK[ui.sheet];
return '<div class="sheet" data-a="close"><div class="sh" data-a="none"><h3>New '+b.name+' category</h3><input id="cn" placeholder="e.g. Amma, Work, Finance" data-e="cat"><div class="sw">'+COLORS.map(function(c){return '<button data-a="col" data-c="'+c+'" class="'+(c===ui.color?'on':'')+'" style="background:'+c+'"></button>'}).join('')+'</div><button class="go" style="background:'+ui.color+';width:100%" data-a="mk">Create category</button></div></div>'}
function render(){var h=ui.view==='home'?home():catv();if(ui.sheet)h+=sheet();if(ui.menu)h+=menu();var ae=document.activeElement,aid=ae&&ae.tagName==='INPUT'&&ae.id,av=aid?ae.value:'';document.getElementById('app').innerHTML=h;if(aid&&!ui.focus){var ne=document.getElementById(aid);if(ne){ne.value=av;ne.focus()}}
if(ui.focus){var e=document.getElementById(ui.focus);if(e)e.focus();ui.focus=null}}
function task(id){return find().tasks.filter(function(t){return t.id===id})[0]}
function addTask(){var i=document.getElementById('nt'),v=i.value.trim();if(!v)return;find().tasks.unshift(T(v));save();ui.focus='nt';render()}
function addSub(id){var i=document.getElementById('si-'+id),v=i.value.trim();if(!v)return;task(id).subs.push({id:uid(),t:v,done:false});save();ui.focus='si-'+id;render()}
function mkCat(){var v=document.getElementById('cn').value.trim();if(!v)return;S[ui.sheet].push({id:uid(),name:v,color:ui.color,tasks:[],arch:[]});ui.sheet=null;save();render()}
document.addEventListener('click',function(ev){var el=ev.target.closest('[data-a]');if(!el)return;var a=el.dataset.a,d=el.dataset;
if(a==='none')return;
if(a==='cat'){ui.view='cat';ui.b=d.b;ui.c=d.id;ui.filter='open';ui.armed=null;window.scrollTo(0,0)}
else if(a==='in'){ui.err='';if(window.cloudIn)window.cloudIn();else{ui.err='Sync needs an internet connection the first time.'}}
else if(a==='out'){if(window.cloudOut)window.cloudOut();return}
else if(a==='menu'){ui.menu=true;ui.msg='';ui.armed=null}
else if(a==='mclose'){ui.menu=false;ui.armed=null}
else if(a==='arch'){var ca=find(),dd=ca.tasks.filter(function(x){return x.done});ca.arch=ca.arch.concat(dd);ca.tasks=ca.tasks.filter(function(x){return!x.done});save()}
else if(a==='rest'){var cr=find(),it=cr.arch.filter(function(x){return x.id===d.id})[0];cr.arch=cr.arch.filter(function(x){return x.id!==d.id});cr.tasks.unshift(it);save()}
else if(a==='dela'){if(ui.armed==='a'+d.id){var cd=find();cd.arch=cd.arch.filter(function(x){return x.id!==d.id});ui.armed=null;save()}else ui.armed='a'+d.id}
else if(a==='bk'){ui.msg=dl('todo-backup-'+ymd()+'.json',JSON.stringify({type:'todo-backup',v:1,data:S}))?'Backup saved to your Downloads.':'Could not save the file.'}
else if(a==='xp'){var its=[];['personal','professional'].forEach(function(k){S[k].forEach(function(c){c.tasks.forEach(function(t){if(!t.done)its.push({b:k,cat:c.name,color:c.color,task:t})})})});ui.msg=dl('todo-pending-'+ymd()+'.json',JSON.stringify({type:'todo-pending',v:1,items:its}))?its.length+' pending tasks saved to your Downloads.':'Could not save the file.'}
else if(a==='ip'){ui.imp='pending';document.getElementById('imp').click();return}
else if(a==='ir'){if(ui.armed!=='ir'){ui.armed='ir';ui.msg='Restore replaces everything here and in your synced list. Tap Restore again to choose a file.'}else{ui.armed=null;ui.imp='restore';document.getElementById('imp').click();return}}
else if(a==='ny'){if(ui.armed!=='ny'){ui.armed='ny';ui.msg='This saves a backup file, then removes closed and archived tasks. Open tasks stay. Tap again to confirm.'}else{ui.armed=null;if(dl('todo-backup-'+ymd()+'.json',JSON.stringify({type:'todo-backup',v:1,data:S}))){['personal','professional'].forEach(function(k){S[k].forEach(function(c){c.tasks=c.tasks.filter(function(t){return!t.done});c.arch=[]})});save();ui.msg='Backup saved to Downloads. Closed tasks cleared. Open tasks carried over.'}else ui.msg='Backup failed, so nothing was cleared.'}}
else if(a==='home'){ui.view='home';ui.armed=null}
else if(a==='f')ui.filter=d.f;
